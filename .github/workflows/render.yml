name: Render episode

# Render an episode on a 4-core runner and post the finished video to Telegram.
#
# Trigger it from the Actions tab (Run workflow) and type the episode slug,
# or from the CLI:
#   gh workflow run render.yml -f episode=003-never-sleep
#
# Required secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN   bot token from @BotFather
#   TELEGRAM_CHAT_ID     chat or group id (a group id starts with -)
#   PEXELS_API_KEY       only needed when new stock footage must be fetched

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode slug (folder under episodes/)"
        required: true
        default: "003-never-sleep"
        type: string
      from:
        description: "Start step"
        required: false
        default: "stock"
        type: choice
        options: [stock, tts, still, clip, merge, audio, upload]
      to:
        description: "Stop step"
        required: false
        default: "upload"
        type: choice
        options: [stock, tts, still, clip, merge, audio, upload]
      send:
        description: "Send to Telegram when done"
        required: false
        default: true
        type: boolean

  # optional: render automatically when an episode's scenes change
  # push:
  #   paths:
  #     - 'episodes/**/scenes.json'

concurrency:
  group: render-${{ github.event.inputs.episode || github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          # nodejs/npm are preinstalled on the runner — installing them via apt is
          # slow and can downgrade Node. Only ffmpeg and jq are actually needed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          ffmpeg -version | head -1
          node -v

      # Caches are split into restore/save so they are written even when the render
      # fails. A plain actions/cache@v4 only saves on success, so a failing pipeline
      # could never populate its own cache and every retry paid the full install cost.
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install node dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          # Kino's postinstall downloads a dead ffmpeg build (404) and aborts npm.
          # It is unused by the render path, so skip install scripts entirely —
          # the pipeline uses the system ffmpeg installed above.
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          npm ci --no-audit --no-fund --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts

      - name: Save node_modules
        if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Piper (text to speech)
        run: |
          pip install --quiet piper-tts
          # pip puts the console script in ~/.local/bin on the runner, which is not
          # on PATH by default — add it and prove the binary runs
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v piper || { echo "::error::piper not installed"; exit 1; }
          piper --help >/dev/null 2>&1 && echo "piper OK" || { echo "::error::piper broken"; exit 1; }

      - name: Restore voice models
        uses: actions/cache/restore@v4
        id: voice-cache
        with:
          path: ~/.local/share/piper-voices
          key: piper-voices-v1

      - name: Fetch voice models
        run: ./scripts/voice-fetch.sh

      - name: Save voice models
        if: steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/piper-voices
          key: piper-voices-v1

      # Rendering intermediates are the expensive part: TTS, stills and 60+ clips.
      # Keyed on the episode inputs, so a re-run after a one-line fix resumes
      # instead of rebuilding everything from zero. Saved even on failure so a
      # broken merge does not cost another 2 minutes of rendering.
      - name: Restore render intermediates
        uses: actions/cache/restore@v4
        id: render-cache
        with:
          path: |
            assets/clips/${{ github.event.inputs.episode || '003-never-sleep' }}
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/audio
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/stills
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/clips
          key: render-${{ github.event.inputs.episode || '003-never-sleep' }}-${{ hashFiles('episodes/**', 'assets/takumi/**', 'scripts/pipeline.sh') }}

      - name: Render
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          chmod +x scripts/*.sh scripts/tts
          ARGS="--from ${{ github.event.inputs.from || 'stock' }} --to ${{ github.event.inputs.to || 'upload' }}"
          if [ "${{ github.event.inputs.send }}" = "false" ]; then ARGS="$ARGS --no-send"; fi
          ./scripts/ci-render.sh "${{ github.event.inputs.episode || '003-never-sleep' }}" $ARGS

      - name: Save render intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            assets/clips/${{ github.event.inputs.episode || '003-never-sleep' }}
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/audio
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/stills
            .temp/${{ github.event.inputs.episode || '003-never-sleep' }}/clips
          key: render-${{ github.event.inputs.episode || '003-never-sleep' }}-${{ hashFiles('episodes/**', 'assets/takumi/**', 'scripts/pipeline.sh') }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.episode || '003-never-sleep' }}
          # .temp is a dot-directory; upload-artifact skips hidden paths unless
          # include-hidden-files is set, which is why the first successful run
          # reported "No files were found" despite final.mp4 existing.
          path: .temp/*/final.mp4
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
